<!DOCTYPE html>
<html>

<head>

    <title>IMP | {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='images/IMP_favourite_icon.png') }}">

    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
        }

        .header-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f4f6f9;
            z-index: 1000;
            border-bottom: 1px solid #d3d3d3;
        }

        .content-container {
            margin-top: 280px;
            margin-bottom: 90px;
        }

        .footer-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f4f6f9;
            border-top: 1px solid #d3d3d3;
            padding: 10px;
            text-align: center;
        }

        .card {
            box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
            border-radius: 8px;
        }

        .container {
            max-width: 1800px;
        }

        .btn {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: rgb(44, 39, 39);
            font-weight: bold;
        }

        .page-toolbar {
            position: sticky;
            top: 0;
            z-index: 999;
            background-color: #f4f6f9;
            padding: 10px 0;
            border-bottom: 1px solid #d3d3d3;
        }

        .btn:hover {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: white;
            transition: 1s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="header-fixed">
        <div class="container text-center mt-5">
            <img src="/static/images/Logo.png" class="img-fluid" style="max-width:400px;" alt="Logo">
            <h1 class="mt-4 mb-3">
                {% block page_title %}
                {% endblock %}
            </h1>
            <p class="text-muted">
                {% block page_subtitle %}
                {% endblock %}
            </p>
        </div>
    </div>
    <div class="container content-container">
        {% block content %}
        {% endblock %}
    </div>
    <footer class="footer-fixed">
        <small>
            Built for BY WMS Discrete
        </small>
        <br>
        <small>
            Need assistance?
            <a
                href="mailto:service_desk@yourcompany.com?subject=IMP Support Request&body=Hi Team,%0D%0A%0D%0AI need assistance with IMP.%0D%0A%0D%0AIssue Description:%0D%0A%0D%0A%0D%0AEnvironment:%0D%0A%0D%0AFacility:%0D%0A%0D%0ASteps Taken:%0D">
                Contact Service Desk
            </a>
        </small>
    </footer>
</body>

</html>
