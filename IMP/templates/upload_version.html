<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>IMP | Upload Version</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" type="image/png" href="{{ url_for('static', path='images/IMP_favourite_icon.png') }}">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 900px;
        }

        .card {
            box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
            border-radius: 8px;
        }

        .btn-warning {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: black;
            font-weight: bold;
        }

        .btn-warning:hover {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: white;
        }

        .extension-summary {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 16px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">

        <div class="text-center">
            <img src="/static/images/Logo.png" class="img-fluid" style="max-width: 400px;" alt="Logo">
        </div>

        <a href="/extension/{{ extension_id }}" class="btn btn-secondary mt-4">
            Back
        </a>

        <div class="card mt-4">

            <div class="card-header">
                <strong>Upload Version</strong>
            </div>

            <div class="card-body">

                <div class="extension-summary mb-4">
                    <div class="row">

                        <div class="col-md-6">
                            <strong>Extension Code</strong>
                            <div>{{ rollout_code }}</div>
                        </div>

                        <div class="col-md-6">
                            <strong>Extension Name</strong>
                            <div>{{ rollout_name }}</div>
                        </div>

                    </div>
                </div>

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form action="/extension/{{ extension_id }}/version/new" method="post" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label for="version_number" class="form-label">
                            Version
                        </label>

                        <input type="text" id="version_number" name="version_number" class="form-control"
                            value="{{ next_version }}" readonly required>

                        <div class="form-text">
                            IMP has automatically generated the next version number.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">
                            Status
                        </label>

                        <select id="status" name="status" class="form-select" required>
                            <option value="Draft" selected>
                                Draft
                            </option>

                            <option value="Testing">
                                Testing
                            </option>

                            <option value="Approved">
                                Approved
                            </option>

                            <option value="Released">
                                Released
                            </option>

                            <option value="Completed">
                                Completed
                            </option>

                            <option value="Obsolete">
                                Obsolete
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="created_by" class="form-label">
                            Created By
                        </label>

                        <input type="text" id="created_by" name="created_by" class="form-control" value="Daniel"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="notes" class="form-label">
                            Version Notes
                        </label>

                        <textarea id="notes" name="notes" rows="5" class="form-control"
                            placeholder="Enter a summary of the changes included in this version"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="version_file" class="form-label">
                            Rollout ZIP File
                        </label>

                        <input type="file" id="version_file" name="version_file" class="form-control"
                            accept=".zip,application/zip" required>

                        <div class="form-text">
                            Select the rollout package in ZIP format.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning">
                        Upload Version
                    </button>

                    <a href="/extension/{{ extension_id }}" class="btn btn-secondary ms-2">
                        Cancel
                    </a>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
