{% extends "base.html" %}

{% block title %}
Improvements
{% endblock %}

{% block page_title %}
Improvement Suggestions
{% endblock %}

{% block page_subtitle %}
Help improve IMP by submitting ideas and feedback
{% endblock %}

{% block content %}
<br>
<br>
<br>
<form method="post" action="/improvements">
    <div class="mb-3">
        <label class="form-label">
            Details regarding the idea you have
        </label>
        <textarea name="description" rows="8" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">
            Name (Optional)
        </label>
        <input type="text" name="submitted_name" class="form-control">
    </div>
    <div class="mb-4">
        <label class="form-label">
            Email (Optional)
        </label>
        <input type="email" name="submitted_email" class="form-control">
    </div>
    <button type="submit" class="btn btn-warning">
        Submit Suggestion
    </button>
    <a href="/" class="btn btn-secondary">
        Cancel
    </a>
</form>

{% endblock %}
