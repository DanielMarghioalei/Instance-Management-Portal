{% extends "base.html" %}

{% block title %}
Report Job Output
{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between mb-4">
        <h2>
            Generated Reporting Job
        </h2>
        <a href="/report-jobs" class="btn btn-secondary">
            Back
        </a>
    </div>
    <!-- EMAIL INSERTS -->
    <div class="card mb-4">
        <div class="card-header">
            Email Inserts
        </div>
        <div class="card-body">
            <textarea id="email_inserts" rows="15" class="form-control">{{ email_inserts }}</textarea>
            <button class="btn btn-primary mt-3" onclick="copyText('email_inserts')">
                Copy Email Inserts
            </button>
        </div>
    </div>
    <!-- JOB DEFINITION -->
    <div class="card mb-4">
        <div class="card-header">
            Job Definition Insert
        </div>
        <div class="card-body">
            <textarea id="job_definition" rows="30" class="form-control">{{ job_definition }}</textarea>
            <button class="btn btn-primary mt-3" onclick="copyText('job_definition')">
                Copy Job Definition
            </button>
        </div>
    </div>
    <!-- COMPLETE SCRIPT -->
    <div class="card mb-4">
        <div class="card-header">
            Complete Script
        </div>
        <div class="card-body">
            <textarea id="complete_script" rows="40" class="form-control">{{ combined_script }}</textarea>
            <button class="btn btn-success mt-3" onclick="copyText('complete_script')">
                Copy Everything
            </button>
        </div>
    </div>
</div>
<script>
    function copyText(id) {
        var element =
            document.getElementById(id);
        element.select();
        navigator.clipboard.writeText(
            element.value
        );
    }
</script>
{% endblock %}
