<!DOCTYPE html>
<html>

<head>
    <title>IMP | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', path='images/IMP_favourite_icon.png') }}">
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
        }

        .header-fixed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #f4f6f9;
            z-index: 1000;
            border-bottom: 1px solid #d3d3d3;
        }

        .results-container {
            margin-top: 320px;
            margin-bottom: 90px;
        }

        .footer-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f4f6f9;
            border-top: 1px solid #d3d3d3;
            padding: 10px;
            text-align: center;
        }

        .card {
            box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
            border-radius: 8px;
        }

        .container {
            max-width: 1300px;
        }

        .btn {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: rgb(44, 39, 39);
            font-weight: bold;
        }

        .btn:hover {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: white;
            transition: 1s ease-in-out;
        }
    </style>
</head>

<body style="background-color: #f4f6f9;">
    <div class="header-fixed">
        <div class="container text-center mt-5">
            <ul class="list-group">
                <li class="list-group-item border-0 bg-transparent text-center">
                    <img src="/static/images/Logo.png" class="img-fluid" style="max-width: 400px;" alt="Logo">
                </li>
                <br>
            </ul>
            <br>
            <h1 class="mt-4 mb-4">
                Instance Management Portal
            </h1>
            <p class="text-muted">
                Search instances, facilities, contacts and application URLs
            </p>
        </div>
    </div>
    <br>
    <br>
    <br>
    <br>
    <div class="container results-container">
        <form action="/search" method="get">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <input type="text" name="search" class="form-control form-control-lg"
                        placeholder="Search Instance, Customer or Site">
                </div>
            </div>
            <div class="row justify-content-center mt-3">
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Search
                    </button>
                </div>
            </div>
        </form>
    </div>
    </div>
    <br>
    <br>
    <br>
    <hr>
    <div class="row justify-content-center mt-5">
        <div class="col-6">
            <div class="text-center mb-4" style="font-size: 25px; text-decoration: black;font-weight: bold;">
                Need something else?
            </div>
            <div class="d-flex justify-content-between" style="text-decoration: underline;">
                <a href="/documentation" style="color: rgb(37, 31, 31);">
                    Documentation
                </a>
                <a href="/extensions" style="color: rgb(37, 31, 31);">
                    Extensions
                </a>
                <a href="/improvements" style="color: rgb(37, 31, 31);">
                    Improvements
                </a>
                <a href="/training" style="color: rgb(37, 31, 31);">
                    Training
                </a>
            </div>
        </div>
    </div>
    <footer class="footer-fixed">
        <small>
            Built for BY WMS Discrete
        </small>
        <br>
        <small>
            Need assistance?
            <a
                href="mailto:service_desk@yourcompany.com?subject=IMP Support Request&body=Hi Team,%0D%0A%0D%0AI need assistance with IMP.%0D%0A%0D%0AIssue Description:%0D%0A%0D%0A%0D%0AEnvironment:%0D%0A%0D%0AFacility:%0D%0A%0D%0ASteps Taken:%0D">
                Contact Service Desk
            </a>
        </small>
    </footer>
</body>

</html>
