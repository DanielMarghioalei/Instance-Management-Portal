<!DOCTYPE html>
<html>

<head>
    <title>IMP | Upload File</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .container {
            max-width: 900px;
        }

        .card {
            box-shadow: 0 2px 6px rgba(0, 0, 0, .1);
            border-radius: 8px;
        }

        .btn-warning {
            background-color: #F5A81D;
            border-color: #F5A81D;
            color: black;
            font-weight: bold;
        }

        .btn-warning:hover {
            color: white;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="text-center">
            <img src="/static/images/Logo.png" class="img-fluid" style="max-width:400px;">
        </div>
        <a href="/extension/{{ extension_id }}" class="btn btn-secondary mt-4">
            Back
        </a>
        <div class="card mt-4">
            <div class="card-header">
                <strong>Upload Document</strong>
            </div>
            <div class="card-body">
                <form action="/extension/{{ extension_id }}/document/upload" method="POST"
                    enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="document_type" class="form-label">
                            Document Type
                        </label>
                        <select name="document_type" id="document_type" class="form-select" required>
                            <option value="FDD">FDD</option>
                            <option value="Test Script">Test Script</option>
                            <option value="Sign Off">Sign Off</option>
                            <option value="Release Notes">Release Notes</option>
                            <option value="Screenshot">Screenshot</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <input type="hidden" name="version_id" value="{{ versions[0][0] }}">
                    <div class="mb-3">
                        <label for="document_file" class="form-label">
                            Select File
                        </label>
                        <input type="file" name="document_file" id="document_file" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-warning">
                        Upload
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
